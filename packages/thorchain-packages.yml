generated: '2026-07-21'
method: searched
source: https://www.npmjs.com/org/xchainjs
notes: >-
  THORChain itself is a Cosmos-SDK L1 protocol (THORNode) plus the Midgard
  indexer; it does not publish a first-party, single-language SDK. The
  canonical client-library surface is the community-maintained XChainJS
  ecosystem, which the official developer docs (dev.thorchain.org) reference
  as the recommended integration path. The xchain-thornode and xchain-midgard
  packages are OpenAPI-generated directly from THORChain's own THORNode and
  Midgard specs. Marked official:false (separate xchainjs GitHub org), but
  they are the recommended, spec-generated JavaScript/TypeScript clients.
packages:
  - language: typescript
    registry: npm
    name: "@xchainjs/xchain-thorchain"
    url: https://www.npmjs.com/package/@xchainjs/xchain-thorchain
    install: npm install @xchainjs/xchain-thorchain
    version: 3.0.20
    official: false
    description: Thorchain client and utilities used by XChainJS clients.
  - language: typescript
    registry: npm
    name: "@xchainjs/xchain-thornode"
    url: https://www.npmjs.com/package/@xchainjs/xchain-thornode
    install: npm install @xchainjs/xchain-thornode
    version: 1.2.2
    official: false
    description: >-
      Thornode module exposing all THORNode functions, generated with
      openapi-generator from THORChain's THORNode OpenAPI spec.
  - language: typescript
    registry: npm
    name: "@xchainjs/xchain-midgard"
    url: https://www.npmjs.com/package/@xchainjs/xchain-midgard
    install: npm install @xchainjs/xchain-midgard
    version: 1.1.3
    official: false
    description: >-
      Midgard module exposing all Midgard functions, generated with
      openapi-generator from THORChain's Midgard OpenAPI spec.
  - language: typescript
    registry: npm
    name: "@xchainjs/xchain-thorchain-query"
    url: https://www.npmjs.com/package/@xchainjs/xchain-thorchain-query
    install: npm install @xchainjs/xchain-thorchain-query
    version: 3.1.2
    official: false
    description: >-
      Query module responsible for estimating swaps and calculating
      THORChain transaction outcomes.
  - language: typescript
    registry: npm
    name: "@xchainjs/xchain-thorchain-amm"
    url: https://www.npmjs.com/package/@xchainjs/xchain-thorchain-amm
    install: npm install @xchainjs/xchain-thorchain-amm
    version: 3.1.2
    official: false
    description: >-
      Module that exposes estimating and swapping cryptocurrency assets on
      THORChain (the automated market maker flow).
