openapi: 3.2.0
info:
  contact:
    email: devs@thorchain.org
  description: The Midgard Public API queries THORChain and any chains linked via the Bifröst and prepares information about the network to be readily available for public users. The API parses transaction event data from THORChain and stores them in a time-series database to make time-dependent queries easy. Midgard does not hold critical information. To interact with THORChain protocol, users should query THORNode directly.
  title: Midgard Public Specification API
  version: 2.34.2
servers:
- url: https://gateway.liquify.com/chain/thorchain_midgard
tags:
- name: Specification
paths:
  /v2/doc:
    get:
      description: Swagger/OpenAPI 3.0 specification generated documents.
      operationId: GetDocs
      responses:
        '200':
          description: swagger/OpenAPI 3.0 spec generated docs
      summary: Documentation
      tags:
      - Specification
  /v2/swagger.json:
    get:
      description: Returns human and machine readable swagger/openapi specification
      operationId: GetSwagger
      responses:
        '200':
          description: human and machine readable swagger/openapi specification
      summary: Swagger File
      tags:
      - Specification
