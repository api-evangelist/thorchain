openapi: 3.2.0
info:
  contact:
    email: devs@thorchain.org
  description: The Midgard Public API queries THORChain and any chains linked via the Bifröst and prepares information about the network to be readily available for public users. The API parses transaction event data from THORChain and stores them in a time-series database to make time-dependent queries easy. Midgard does not hold critical information. To interact with THORChain protocol, users should query THORNode directly.
  title: Midgard Public Knownpools API
  version: 2.34.2
servers:
- url: https://gateway.liquify.com/chain/thorchain_midgard
tags:
- name: Knownpools
paths:
  /v2/knownpools:
    get:
      description: Returns an object with known pools and their statuses
      operationId: GetKnownPools
      responses:
        '200':
          $ref: '#/components/responses/KnownPoolsResponse'
      summary: Known Pools List
      tags:
      - Knownpools
components:
  schemas:
    KnownPools:
      additionalProperties:
        type: string
      example:
        BTC.BTC: available
      type: object
  responses:
    KnownPoolsResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnownPools'
      description: Object containing known pools to status mapping
